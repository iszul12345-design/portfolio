<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Interactive Profile Card</title> 
    <style> 
        /* General Styles */ 
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        } 
 
        /* Profile Card Container */ 
        .card-container { 
            perspective: 1000px; 
        } 
 
        .profile-card { 
            width: 400px; 
            height: 400px; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.6s; 
        } 
 
        /* Flip Card Effect */ 
        .card-container:hover .profile-card { 
            transform: rotateY(180deg); 
        } 
 
        /* Front & Back Side */ 
        .card-front, .card-back { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            backface-visibility: hidden; 
            border-radius: 15px; 
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            transition: 0.5s; 
        } 
 
        /* Front Side */ 
        .card-front { 
            background: white; 
            padding: 20px; 
        } 
 
        /* Back Side */ 
        .card-back { 
            background: linear-gradient(135deg, #007BFF, #ff6b6b); 
            color: white; 
            transform: rotateY(180deg); 
        } 
 
        /* Profile Image */ 
        .profile-card img { 
            width: 200px; 
            height: 220px; 
            border-radius: 50%; 
            border: 3px solid #007BFF; 
            transition: transform 0.3s; 
        } 
 
        /* Hover Effect on Profile Image */ 
        .profile-card img:hover { 
            transform: scale(1.1); 
        } 
 
        /* Profile Name */ 
        .profile-card h2 { 
            margin: 10px 0; 
            font-size: 22px; 
            color: #333; 
        } 
 
        /* Profile Description */ 
        .profile-card p { 
            font-size: 14px; 
            color: #666; 
            margin-bottom: 20px; 
        } 
 
        /* Button Styling */ 
        .profile-card button { 
            background: #007BFF; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease-in-out; 
        } 
 
        /* Button Hover Effect */ 
        .profile-card button:hover { 
            background: orange; 
        } 
 
        /* Dark Mode Button */ 
        .theme-switch { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            cursor: pointer; 
            font-size: 20px; 
            padding: 5px; 
        } 
 
        /* Dark Mode Styling */ 
        body.dark-mode { 
            background-color: #222; 
        } 
 
        .dark-mode .card-front { 
            background: #333; 
            color: white; 
        } 
 
        /* 📌 Responsive Design */ 
        @media (max-width: 768px) { 
            .profile-card { 
                width: 80%; 
            } 
 
            .profile-card img { 
                width: 100px; 
                height: 100px; 
            } 
 
            .profile-card h2 { 
                font-size: 20px; 
            } 
 
            .profile-card p { 
                font-size: 13px; 
            } 
 
            .profile-card button { 
                padding: 10px 18px; 
                font-size: 14px; 
            } 
        } 
 
        @media (max-width: 480px) { 
            .profile-card { 
                width: 90%; 
            } 
 
            .profile-card img {
width: 80px; 
                height: 80px; 
            } 
 
            .profile-card h2 { 
                font-size: 18px; 
            } 
 
            .profile-card p { 
                font-size: 12px; 
            } 
 
            .profile-card button { 
                padding: 8px 15px; 
                font-size: 13px; 
            } 
        } 
    </style> 
</head> 
<body> 
 
    <div class="card-container"> 
        <div class="profile-card"> 
            <!-- Front Side --> 
            <div class="card-front"> 
                <span class="theme-switch">🌙</span> 
                <img src="student.jpeg" alt="Profile Picture"> 
                <h2>John Doe</h2> 
                <p>Web Developer | UI/UX Designer</p> 
                <button>Follow Me</button> 
            </div> 
 
            <!-- Back Side --> 
            <div class="card-back"> 
                <h2>More Info</h2> 
                <p>Skills: HTML, CSS, JavaScript</p> 
                <p>Location: New York, USA</p> 
                <p>Available for Freelance Projects!</p> 
            </div> 
        </div> 
    </div> 
 
</body> 
</html>
